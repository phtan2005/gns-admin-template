<!doctype html>
<html lang="vi" data-layout="vertical" data-sidebar="dark" data-sidebar-size="lg" data-preloader="disable" data-theme="default" data-topbar="light" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <title>Quản lý nhóm khách hàng | GNS Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quản lý nhóm khách hàng">
  <link rel="shortcut icon" href="assets/images/favicon.ico">
  <link href="assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/icons.min.css" rel="stylesheet">
  <link href="assets/css/app.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="layout-wrapper">
    <aside class="app-menu navbar-menu">
      <div class="navbar-brand-box">
        <a href="index.html" class="logo logo-dark">
          <span class="logo-sm"><img src="assets/images/logo-sm.png" alt="GNS" height="22"></span>
          <span class="logo-lg"><img src="assets/images/logo-dark.png" alt="GNS" height="22"></span>
        </a>
        <a href="index.html" class="logo logo-light">
          <span class="logo-sm"><img src="assets/images/logo-sm.png" alt="GNS" height="22"></span>
          <span class="logo-lg"><img src="assets/images/logo-light.png" alt="GNS" height="22"></span>
        </a>
      </div>
      <div id="scrollbar">
        <div class="container-fluid">
          <ul class="navbar-nav" id="navbar-nav">
            <li class="menu-title"><span>Menu</span></li>
            <li class="nav-item">
              <a class="nav-link menu-link" href="index.html"><i class="ph-house"></i><span>Tổng quan</span></a>
            </li>
          </ul>
        </div>
      </div>
    </aside>

    <header id="page-topbar">
      <div class="layout-width">
        <div class="navbar-header">
          <div class="d-flex">
            <div class="navbar-brand-box horizontal-logo">
              <a href="index.html" class="logo logo-dark">
                <span class="logo-sm"><img src="assets/images/logo-sm.png" alt="GNS" height="22"></span>
                <span class="logo-lg"><img src="assets/images/logo-dark.png" alt="GNS" height="22"></span>
              </a>
            </div>
            <button type="button" class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger shadow-none" id="topnav-hamburger-icon" aria-label="Mở trình đơn">
              <span class="hamburger-icon"><span></span><span></span><span></span></span>
            </button>
          </div>
          <div class="d-flex align-items-center">
            <span class="text-muted d-none d-sm-inline">Quản trị khách hàng</span>
          </div>
        </div>
      </div>
    </header>

    <div class="main-content">
      <div class="page-content">
        <div class="container-fluid">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
            <div>
              <h4 class="mb-1">Quản lý nhóm khách hàng</h4>
              <p class="text-muted mb-0">Tổ chức và quản lý khách hàng theo từng nhóm.</p>
            </div>
            <a href="customer-group-form.html" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Tạo nhóm khách hàng</a>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="row g-2">
                <div class="col-md-8">
                  <label class="visually-hidden" for="group-search">Tìm nhóm khách hàng</label>
                  <input id="group-search" class="form-control" type="search" placeholder="Tìm theo tên hoặc mô tả...">
                </div>
                <div class="col-md-4">
                  <label class="visually-hidden" for="status-filter">Lọc trạng thái</label>
                  <select id="status-filter" class="form-select">
                    <option value="">Tất cả trạng thái</option>
                    <option value="active">Đang hoạt động</option>
                    <option value="inactive">Ngừng hoạt động</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Nhóm khách hàng</th>
                      <th>Số thành viên</th>
                      <th>Trạng thái</th>
                      <th>Cập nhật</th>
                      <th class="text-end">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody id="groups-table-body"></tbody>
                </table>
              </div>
              <div id="groups-empty" class="customer-groups-empty d-none">Không có nhóm khách hàng phù hợp.</div>
            </div>
            <div class="card-footer">
              <nav aria-label="Phân trang nhóm khách hàng">
                <ul id="groups-pagination" class="pagination justify-content-end mb-0"></ul>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/pages/customer-groups-store.js"></script>
  <script src="assets/js/pages/customer-groups-list.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
